services:
  compressinator:
    image: ghcr.io/lambdan/video-compressinator:0.1
    environment:
      - DATA_DIR=/data
      - MEDIA_DIR=/media
      - TEMP_DIR=/temp
      #- ITERATION_INTERVAL_SECONDS=3600
      #- PASSTHROUGH_VIDEO_CODECS=hevc,av1
      #- PASSTHROUGH_AUDIO_CODECS=aac,mp3,opus,vorbis
      #- KEEP_AUDIO_LANGUAGES=eng,swe
      #- VIDEO_ENCODER=libx265
      #- AUDIO_ENCODER=libopus
      #- PIX_FMT=yuv420p10le
      #- CRF=27
      #- VIDEO_SCALE=-1:720
      #- X_PRESET=slow
      #- INPUT_VIDEO_EXTS=mp4,mkv,avi,mov,flv,webm,m4v
      #- OUTPUT_VIDEO_EXT=mkv
      - DELETE_ORIGINAL_AFTER_DAYS=7
    volumes:
      - /mnt/user/appdata/compressinator:/data
      - /mnt/user/m/media:/media
      - /tmp/compressinator:/temp
